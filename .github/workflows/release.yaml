name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@86546533e7fe42b748a54ea123c6aa4e3e812241 # v2.0.31
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
