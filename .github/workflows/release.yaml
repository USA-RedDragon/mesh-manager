name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@e7afc0ee5060bc77e9a4a7d0af278f8e5716b668 # v2.0.20
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
